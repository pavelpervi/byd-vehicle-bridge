name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Clean up old versions (keep last 5, exclude latest and semver)
        run: |
          OWNER="${{ github.repository_owner }}"
          PACKAGE="${{ github.repository }}"

          # Get all versions, sorted by creation time (oldest first)
          VERSIONS=$(gh api \
            --paginate \
            -H "Accept: application/vnd.github.v3+json" \
            "/orgs/$OWNER/packages/container/$PACKAGE/versions?per_page=100" \
            --jq '[.[] | select(.metadata.container.tags | length > 0)] | sort_by(.created_at) | reverse | .[].id' 2>/dev/null)

          if [ -z "$VERSIONS" ]; then
            echo "No versions to clean up"
            exit 0
          fi

          # Keep the latest 5, delete the rest
          LATEST_5=$(echo "$VERSIONS" | head -5)
          TO_DELETE=$(echo "$VERSIONS" | tail -n +6)

          if [ -z "$TO_DELETE" ]; then
            echo "Only $LATEST_5 versions — nothing to clean up"
            exit 0
          fi

          echo "Keeping: $LATEST_5"
          echo "Deleting old versions..."
          for VERSION_ID in $TO_DELETE; do
            echo "  Deleting version $VERSION_ID..."
            gh api -X DELETE \
              -H "Accept: application/vnd.github.v3+json" \
              "/orgs/$OWNER/packages/container/$PACKAGE/versions/$VERSION_ID" \
              --silent 2>/dev/null || true
          done
          echo "Cleanup complete"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}